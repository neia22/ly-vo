{"@context":"https://schema.org","@type":"Blog","name":"Lyvo Blog","url":"https://ly-vo.app/blog/","publisher":{"@type":"Organization","name":"Lyvo","url":"https://ly-vo.app/"}}

<style>
  .cover-emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;opacity:.92;}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;}
  .empty .big{font-size:42px;margin-bottom:10px;}
  .empty h2{color:var(--text);font-size:22px;margin:0 0 6px;font-weight:800;}
  .skel{grid-column:1/-1;text-align:center;padding:50px;color:var(--faint);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.LYVO_CONFIG={SUPABASE_URL:'https://mwxmzxbuyqfejjygdutz.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_a6ocubvLLPwwKSTEXIFzKg_rQawFt6e'};</script>
</head>
<body>
<header class="site"><div class="nav-in">
  <a class="brand" href="../"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5" stroke="#C9A96E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19h12v-8.5" stroke="#C9A96E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19v-4h4v4" stroke="#F7F3EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Lyvo</a>
  <div class="nav-right"><a href="../">Home</a><a class="nav-cta" href="../#join">Join the waitlist</a></div>
</div></header>

<main class="wrap">
  <section class="blog-hero">
    <div class="eyebrow">the lyvo blog</div>
    <h1>renting &amp; letting, <span class="serif">decoded.</span></h1>
    <p>your no-BS guides to renting, letting &amp; getting paid — screening, deposits, leases, all of it. written for <strong style="color:var(--text)">namibia</strong> 🇳🇦.</p>
  </section>

  <section class="posts" id="posts">
    <div class="skel">Loading articles…</div>
  </section>
</main>

<footer class="site"><div class="foot-in">
  <span>© <span id="yr">2026</span> Lyvo · launching in namibia 🇳🇦</span>
  <span><a href="../#join">Join the waitlist →</a></span>
</div></footer>

<script>
try{document.getElementById('yr').textContent=new Date().getFullYear();}catch(e){}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
(async()=>{
  const box=document.getElementById('posts');
  try{
    const c=window.LYVO_CONFIG;
    const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
    const {data,error}=await sb.from('blog_posts')
      .select('slug,title,excerpt,category,cover_emoji,read_minutes,published_at')
      .eq('status','published').order('published_at',{ascending:false});
    if(error) throw error;
    if(!data||!data.length){
      box.innerHTML='<div class="empty"><div class="big">✨</div><h2>nothing here yet</h2><p>we’re cooking up something good. check back soon — or join the waitlist to get it first.</p></div>';
      return;
    }
    box.innerHTML=data.map(p=>`
      <a class="post-card" href="post.html?slug=${encodeURIComponent(p.slug)}">
        <div class="cover"><span class="cat">${esc(p.category)}</span><span class="cover-emoji">${esc(p.cover_emoji)||'📝'}</span></div>
        <div class="body">
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.excerpt)}</p>
          <div class="meta">${p.read_minutes||5} min read · ${fmt(p.published_at)}</div>
        </div>
      </a>`).join('');
  }catch(e){
    box.innerHTML='<div class="empty"><h2>Couldn’t load articles</h2><p>Please try again shortly.</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
